<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    * { box-sizing: border-box; }
    body { margin: 0; }
    .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace; }

<!-- Left inside page: deliberately left quiet, as plain writing space for the
     sender's own note — a standard greeting-card convention, not a placeholder. -->
<div style="position:relative; width:1500px; height:2100px; background:#ece4d4; overflow:hidden;">

  <!-- outer frame, matching front/back/inside-right -->
  <div style="position:absolute; top:70px; left:70px; right:70px; bottom:70px; border:3px solid #d3c7ab;"></div>

  <div style="position:absolute; bottom:130px; left:0; right:0; text-align:center;">
    <div class="mono" style="font-size:18px; letter-spacing:0.1em; text-transform:uppercase; color:#c2b89e;">Cycle 7 — Archive of Lost Realities</div>
  </div>

</div>
</x-dc>
